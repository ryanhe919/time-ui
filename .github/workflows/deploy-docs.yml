name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy to CentOS Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (docs depends on library)
        run: pnpm -r --filter "./packages/*" build

      - name: Build docs (standalone output)
        run: pnpm --filter @timeui/docs build

      # Next.js standalone output produces a self-contained folder:
      #   apps/docs/.next/standalone/  — server.js + node_modules (minimal)
      #   apps/docs/.next/static/      — static assets (JS/CSS chunks)
      #   apps/docs/public/            — public assets (if any)
      #
      # On the server: `node server.js` — no npm install needed.

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp -r apps/docs/.next/standalone/. deploy/
          cp -r apps/docs/.next/static deploy/apps/docs/.next/static
          [ -d apps/docs/public ] && cp -r apps/docs/public deploy/apps/docs/public || true

          # pnpm monorepo safety net. Next's standalone file-tracer ships
          # its runtime peers (styled-jsx, @swc/helpers, …) only inside
          # `node_modules/.pnpm/next@*/node_modules/` — a path Node's
          # CommonJS resolver never walks to, so `server.js` crashes at
          # boot with `Cannot find module 'styled-jsx/package.json'`.
          # Mirror every sibling of `next/` in that pnpm store alongside
          # `apps/docs/node_modules/next` so the normal upward walk finds
          # them. Pinned to pnpm's virtual-store layout (v7+); revalidate
          # if the pnpm major version changes.
          shopt -s nullglob
          peer_dirs=(deploy/node_modules/.pnpm/next@*/node_modules)
          if [ "${#peer_dirs[@]}" -gt 1 ]; then
            echo "::error::multiple next@* pnpm stores found: ${peer_dirs[*]}"
            exit 1
          fi
          NEXT_PEER_DIR="${peer_dirs[0]:-}"
          if [ -n "$NEXT_PEER_DIR" ]; then
            echo "Hoisting Next.js peer dependencies from $NEXT_PEER_DIR"
            mkdir -p deploy/apps/docs/node_modules
            # One-shot copy of every sibling except `next` itself (tracer
            # already placed it). rsync walks the tree once instead of
            # spawning a cp per package.
            rsync -aL --exclude='/next' --exclude='/next/' \
              "$NEXT_PEER_DIR"/ deploy/apps/docs/node_modules/
          else
            echo "::warning::Could not locate deploy/node_modules/.pnpm/next@*/node_modules — peer hoist skipped"
          fi

      # ── SSH deploy to CentOS / Alibaba Cloud ──────────────────
      # Required secrets (infra):
      #   DEPLOY_HOST         — server IP (e.g. 47.x.x.x)
      #   DEPLOY_USER         — SSH user (e.g. root)
      #   DEPLOY_KEY          — ed25519 private key
      #   DEPLOY_PATH         — remote absolute dir (e.g. /opt/timeui-docs)
      #   DEPLOY_PORT         — SSH port (default 22)
      #   DEPLOY_KNOWN_HOSTS  — (optional but recommended) pre-verified known_hosts entry
      #                         for DEPLOY_HOST. Pin this once from a trusted machine via
      #                         `ssh-keyscan -H -p <port> <host>` and commit its output
      #                         to the secret — this defeats first-use MITM attacks.
      #
      # Optional secrets (docs AI assistant — consumed by apps/docs/src/app/api/assistant):
      #   ANTHROPIC_API_KEY        — required to enable the assistant
      #   ANTHROPIC_BASE_URL       — e.g. https://api.minimaxi.com/anthropic
      #   ANTHROPIC_MODEL          — e.g. MiniMax-M1
      #   ANTHROPIC_PROMPT_CACHE   — "1" to enable Anthropic cache_control markers
      # If ANTHROPIC_API_KEY is absent, the "Provision assistant env" step is skipped
      # and whatever .env.production.local already exists on the server is preserved
      # (rsync --exclude below). That lets operators manage the file manually too.

      - name: Setup SSH (key + host verification)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Private key
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Host key: prefer the pinned secret (trust-on-first-use done locally
          # by the operator); fall back to a live ssh-keyscan. Either way, we
          # do NOT swallow errors — an empty known_hosts must fail the step
          # so we never silently accept any host key.
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set — falling back to live ssh-keyscan (TOFU)."
            ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          # Must have at least one host key line.
          test -s ~/.ssh/known_hosts

          # Pin strict host key checking for every subsequent ssh/rsync call.
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Sanity-check deploy path
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Guard against catastrophic rsync --delete targets:
          #   - must be absolute
          #   - not exactly "/", "/root", "/home", "/etc", "/usr", "/var", "/opt"
          #   - no shell metacharacters
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "DEPLOY_PATH secret is empty"; exit 1
          fi
          case "$DEPLOY_PATH" in
            /) echo "Refusing to deploy to '/'"; exit 1 ;;
            /root|/home|/etc|/usr|/var|/opt|/bin|/sbin|/boot|/dev|/proc|/sys)
              echo "Refusing to deploy to a top-level system directory: $DEPLOY_PATH"; exit 1 ;;
          esac
          if ! printf '%s' "$DEPLOY_PATH" | grep -qE '^/[A-Za-z0-9_./-]+$'; then
            echo "DEPLOY_PATH contains disallowed characters: $DEPLOY_PATH"; exit 1
          fi

      - name: Sync to server
        run: |
          set -euo pipefail
          # `.env.production.local` is owned by the server (written either by the
          # next step from GitHub Secrets, or manually by an operator) and holds
          # ANTHROPIC_* values — never let rsync --delete wipe it.
          rsync -avz --delete \
            --exclude='apps/docs/.env.production.local' \
            --exclude='apps/docs/.env.local' \
            -e "ssh" \
            deploy/ \
            "deploy-target:${{ secrets.DEPLOY_PATH }}/"

      # Render .env.production.local from GitHub Secrets and atomically publish it
      # to the server. Runs AFTER rsync so the file sits outside the build bundle
      # (never in an artifact, never in the runner image cache). Skipped entirely
      # when ANTHROPIC_API_KEY is unset — the server's existing file (if any) is
      # preserved by the rsync --exclude above.
      - name: Provision assistant env on server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_PROMPT_CACHE: ${{ secrets.ANTHROPIC_PROMPT_CACHE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set — skipping server env provisioning. The docs assistant will return 'no-key' until a .env.production.local is provided on the server."
            exit 0
          fi

          # 1. Render env file locally, strict perms via umask.
          umask 077
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          # Values cannot contain newlines; GitHub Secrets strip trailing newlines
          # anyway. We intentionally do NOT quote — Next's @next/env parser handles
          # raw KEY=VALUE lines and quoting would leak literal quotes into process.env.
          {
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            [ -n "${ANTHROPIC_BASE_URL:-}" ]     && printf 'ANTHROPIC_BASE_URL=%s\n'     "$ANTHROPIC_BASE_URL"
            [ -n "${ANTHROPIC_MODEL:-}" ]        && printf 'ANTHROPIC_MODEL=%s\n'        "$ANTHROPIC_MODEL"
            [ -n "${ANTHROPIC_PROMPT_CACHE:-}" ] && printf 'ANTHROPIC_PROMPT_CACHE=%s\n' "$ANTHROPIC_PROMPT_CACHE"
          } >> "$ENV_FILE"

          # 2. Atomic publish: scp to <path>.tmp, chmod on server, mv into place.
          # DEPLOY_PATH was validated earlier (^/[A-Za-z0-9_./-]+$) so it's safe to
          # interpolate into a single-argument remote command — no shell metachars.
          REMOTE_DIR="$DEPLOY_PATH/apps/docs"
          ssh deploy-target "mkdir -p '$REMOTE_DIR'"
          scp -q "$ENV_FILE" "deploy-target:$REMOTE_DIR/.env.production.local.tmp"
          ssh deploy-target "chmod 600 '$REMOTE_DIR/.env.production.local.tmp' && mv '$REMOTE_DIR/.env.production.local.tmp' '$REMOTE_DIR/.env.production.local'"

      - name: Restart on server
        run: |
          set -euo pipefail
          # Heredoc is *single-quoted* (<<'REMOTE') so NOTHING expands in the
          # runner shell — this neutralises $(...) / backticks embedded in any
          # secret. The absolute path is passed as a positional argument, and
          # printf %q shell-escapes it safely.
          REMOTE_ARG=$(printf '%q' "${{ secrets.DEPLOY_PATH }}")
          ssh -T deploy-target "bash -s -- $REMOTE_ARG" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "remote: DEPLOY_PATH must be absolute"; exit 1 ;;
          esac
          # Pick up node/pm2 from nvm or system install paths
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
          cd "$DEPLOY_PATH/apps/docs"
          # Next.js standalone server reads .env.production.local from cwd
          # via @next/env at boot. --update-env ensures pm2 re-inherits the
          # current shell env too (harmless if the file is the source of truth).
          PORT=3000 pm2 restart timeui-docs --update-env 2>/dev/null \
            || PORT=3000 pm2 start server.js --name timeui-docs
          pm2 save
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts
