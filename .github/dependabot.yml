version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 10
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      eslint:
        patterns: ['eslint*', '@typescript-eslint/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom', 'vitest-axe']
      types:
        patterns: ['@types/*']
      emotion:
        patterns: ['@emotion/*']
      build:
        patterns: ['tsup', 'turbo', 'rimraf', 'vite', '@vitejs/*']
    ignore:
      # React 18 is pinned intentionally — promote to 19 only after confirming
      # peer-range compatibility with downstream consumers.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'
