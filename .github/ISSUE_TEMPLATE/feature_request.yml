name: 功能建议
description: 建议新的组件、属性或能力。
title: '[Feat]: '
labels: ['enhancement', 'triage']
body:
  - type: input
    id: package
    attributes:
      label: 目标包
      placeholder: '@timeui/react'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你想解决什么用户问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: a11y
    attributes:
      label: 可访问性考量
      description: 例如 WAI-ARIA 模式、键盘交互、屏幕阅读器行为等。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issues 和 RFC。
          required: true
        - label: 该建议是增量性的，不与现有 API 冲突（或已明确标注为破坏性变更）。
